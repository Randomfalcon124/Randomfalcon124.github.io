<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Akshay Patil Resume</title>
<style>
  @page { size: Letter; margin: 0.4in 0.5in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Cambria, Georgia, serif; font-size: 10pt; line-height: 1.18; color: #000; }
  .sheet { max-width: 7.5in; margin: 0 auto; }
  header { text-align: center; margin-bottom: 4pt; }
  header h1 { font-size: 17pt; margin: 0 0 1pt; }
  header .contact span + span::before { content: ' • '; }
  h2 { font-size: 10pt; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1.2px solid #000; margin: 7pt 0 2pt; padding-bottom: 1pt; }
  .entry { margin-bottom: 2pt; break-inside: avoid; }
  .row { display: flex; justify-content: space-between; gap: 12pt; }
  .row b { font-weight: 700; }
  .dates { font-weight: 700; white-space: nowrap; }
  .sub { font-style: italic; }
  ul { margin: 1pt 0 0; padding-left: 14pt; }
  li { margin: 0; }
  .pending { background: #fff3b0; outline: 1px dashed #b38f00; padding: 2pt 3pt; }
  .skills div b { font-weight: 700; }
  .variant-switch { position: fixed; top: 8px; right: 8px; font: 12px system-ui; }
  @media print { .variant-switch { display: none; } }
</style>
</head>
<body>
<div class="variant-switch"><a href="?v=aero">aero</a> · <a href="?v=robotics">robotics</a></div>
<div class="sheet" id="root"></div>
<script src="data.js"></script>
<script>
  const R = window.RESUME;
  const v = new URLSearchParams(location.search).get('v') || 'aero';
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const pick = b => typeof b === 'string' ? b : (b.v.includes(v) ? b.t : null);

  function entry(id) {
    const e = R.entries[id];
    const head = `<div class="row"><span><b>${esc(e.org)}</b>${e.role && !e.line && !e.coursework ? ' | ' + esc(e.role) : ''}${e.where ? ' – ' + esc(e.where) : ''}</span><span class="dates">${esc(e.dates)}</span></div>`;
    let body = '';
    if (e.line) body += `<div>${esc(e.line)}</div>`;
    if (e.role && e.coursework) body += `<div>${esc(e.role)}</div>`;
    if (e.coursework) {
      const cw = e.coursework[v] || e.coursework.all;
      body += `<div><span class="sub">${id === 'gt' ? 'Current coursework' : 'Coursework'}:</span> ${cw.split(', ').map(c => `<span style="white-space:nowrap">${esc(c)}</span>`).join(', ')}</div>`;
    }
    if (e.pending) body += `<div class="pending">Pending: role, dates, and bullets needed</div>`;
    const bullets = (e.bullets || []).map(pick).filter(Boolean);
    if (bullets.length) body += `<ul>${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
    return `<div class="entry">${head}${body}</div>`;
  }

  const c = R.contact;
  let html = `<header><h1>${c.name}</h1><div class="contact">${c.items.map(i => `<span>${esc(i)}</span>`).join('')}</div></header>`;
  for (const [title, ids] of R.variants[v]) {
    html += `<h2>${title}</h2>`;
    html += ids === 'skills'
      ? `<div class="skills">${R.skills[v].map(([k, s]) => `<div><b>${k}:</b> ${esc(s)}</div>`).join('')}</div>`
      : ids.map(entry).join('');
  }
  document.getElementById('root').innerHTML = html;
  document.title = `Akshay Patil Resume (${v})`;
</script>
</body>
</html>
